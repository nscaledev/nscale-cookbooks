# Contracts: numbered clauses. A clause may carry questions; its page is
# recorded at render time and becomes the gold page.
contracts:
  - doc_id: contract-nimbus
    vendor: Nimbus Telecom
    title: "Nimbus Telecom: Mobile and Broadband Service Agreement"
    reference: "NMB-7720-4415"
    doc_date: "2025-09-18"
    intro: "This agreement is between Nimbus Telecom Ltd ('Nimbus', 'we') and Robin Marlowe ('you') for the services described in the Order Summary."
    summary:
      - ["Customer", "Robin Marlowe, Flat 3, 14 Quill Lane, Lindenford LF2 7QA"]
      - ["Account number", "NMB-7720-4415"]
      - ["Plan", "Nimbus Duo 5G + Fibre 500 (2 SIMs, fibre 500 Mbps)"]
      - ["Service start date", "1 October 2025"]
      - ["Minimum term", "24 months"]
      - ["Monthly charge", "€54.00 including VAT"]
    clauses:
      - title: "1. Services"
        text: "We will provide two mobile SIM cards with unlimited calls, texts and data in the Home Zone, and a fibre broadband connection with a target download speed of 500 Mbps. Speeds are not guaranteed and depend on line conditions, in-home wiring and network traffic."
      - title: "2. Minimum term"
        text: "The minimum term is 24 months from the service start date. After the minimum term the agreement continues on a rolling monthly basis until either party ends it in line with clause 9."
        questions:
          - {type: clause, q: "How long is the minimum term on the Nimbus mobile and broadband contract?", a: "24 months from the service start date (1 October 2025)."}
      - title: "3. Charges and annual price change"
        text: "The monthly charge is shown in the Order Summary. Each year on 1 April your monthly charge will increase by a fixed amount of €3.00. We will tell you about this change at least 30 days in advance. This fixed increase does not give you a right to end the agreement without paying an early termination charge."
        questions:
          - {type: clause, q: "By how much does the Nimbus monthly charge go up each year, and when?", a: "It increases by a fixed €3.00 every year on 1 April."}
          - {type: date_deadline, q: "When does the Nimbus monthly price go up next, counting from 1 April 2026?", a: "1 April 2027 (it rises by €3.00 every 1 April; the first increase was 1 April 2026).", near_miss: true}
      - title: "4. Roaming"
        text: "Use in the Europe Zone is included in your allowance. Use outside the Europe Zone is charged at the rates in our Roaming Price Guide, unless you buy a travel data pass. A travel data pass for the USA costs €15.00 for 7 days."
        questions:
          - {type: clause, q: "Is roaming in the Europe Zone included in the Nimbus plan?", a: "Yes, use in the Europe Zone is included in the allowance."}
      - title: "5. Equipment"
        text: "We will lend you a Nimbus Hub router for the life of the agreement. The router remains our property. If you do not return it within 30 days of the agreement ending, we may charge you €60.00."
        questions:
          - {type: clause, q: "What does Nimbus charge if the router is not returned after the contract ends?", a: "€60.00 if it is not returned within 30 days of the agreement ending."}
      - title: "6. Fair use"
        text: "Unlimited allowances are subject to our Fair Use Policy. If use is excessive or unusual, for example running a server or reselling the service, we may contact you and may restrict the service."
      - title: "7. Payment"
        text: "You agree to pay monthly by direct debit. Bills are issued on the 1st of each month. If a payment fails, we may charge an administration fee of €7.50 and may suspend outgoing services after 14 days."
        questions:
          - {type: clause, q: "What fee does Nimbus charge if a direct debit payment fails?", a: "An administration fee of €7.50."}
      - title: "8. Faults and service credits"
        text: "If your broadband stops working and we do not fix it within 2 working days after you report it, we will credit €9.95 for each further calendar day without service."
        questions:
          - {type: clause, q: "What compensation do we get if the broadband is down for more than two working days?", a: "A credit of €9.95 for each further calendar day without service, after 2 working days from reporting the fault."}
      - title: "9. Ending the agreement"
        text: "You may end this agreement at any time by giving us 30 days' notice. If you end it during the minimum term, you must pay an early termination charge equal to the monthly charges remaining in the minimum term, less 20%."
        questions:
          - {type: clause, q: "What is the notice period to cancel the Nimbus contract?", a: "30 days' notice."}
          - {type: clause, q: "How is the early termination charge calculated if we leave Nimbus during the minimum term?", a: "The monthly charges remaining in the minimum term, less 20%."}
      - title: "10. Complaints"
        text: "If you are unhappy, contact our Customer Care team. If we cannot resolve your complaint within 8 weeks, you may refer it to the independent Communications Ombudsman, free of charge."
      - title: "11. Changes to this agreement"
        text: "We may change these terms for legal, regulatory or security reasons. Where a change is materially to your disadvantage, other than the price change in clause 3, we will give you 30 days' notice and you may end the agreement without an early termination charge."
      - title: "12. Governing law"
        text: "This agreement is governed by the laws of the jurisdiction in which your service address is located."

  - doc_id: contract-lease
    vendor: Harbourview Lettings
    title: "Assured Shorthold Tenancy Agreement"
    reference: "HL-TEN-2025-0381"
    doc_date: "2025-07-14"
    intro: "This tenancy agreement is made between Harbourview Lettings, acting for the landlord Ms Petra Vance ('the Landlord'), and Robin Marlowe and Sam Okafor ('the Tenants')."
    summary:
      - ["Property", "Flat 3, 14 Quill Lane, Lindenford LF2 7QA"]
      - ["Tenants", "Robin Marlowe and Sam Okafor (jointly and severally)"]
      - ["Agreement reference", "HL-TEN-2025-0381"]
      - ["Term", "12 months, from 1 August 2025 to 31 July 2026"]
      - ["Rent", "€1,450.00 per calendar month, payable in advance on the 1st"]
      - ["Deposit", "€2,900.00, held in the Lindenford Deposit Protection Scheme"]
    clauses:
      - title: "1. The term"
        text: "The tenancy is for a fixed term of 12 months starting on 1 August 2025 and ending on 31 July 2026. If neither party gives notice, the tenancy will continue as a periodic tenancy from month to month on the same terms."
        questions:
          - {type: date_deadline, q: "When does the fixed term of our flat lease end?", a: "31 July 2026."}
      - title: "2. Rent"
        text: "The Tenants will pay the rent of €1,450.00 per calendar month in advance on the 1st day of each month by standing order to the account notified by the agent. Rent is payable in full without deduction."
        questions:
          - {type: clause, q: "How much is the monthly rent on the flat?", a: "€1,450.00 per calendar month, payable in advance on the 1st."}
      - title: "3. Deposit"
        text: "The Tenants have paid a deposit of €2,900.00. The deposit is held in the Lindenford Deposit Protection Scheme and will be returned within 10 days of the end of the tenancy, less any agreed deductions for damage beyond fair wear and tear, unpaid rent or cleaning."
        questions:
          - {type: clause, q: "How soon after the tenancy ends must the deposit be returned?", a: "Within 10 days of the end of the tenancy, less any agreed deductions."}
      - title: "4. Rent review"
        text: "The Landlord may review the rent once in any 12-month period, starting no earlier than the end of the fixed term. The Landlord must give at least 2 months' written notice of any increase, and any increase will not exceed the percentage change in the Lindenford Consumer Price Index over the previous 12 months plus 1%."
        questions:
          - {type: clause, q: "How much notice must the landlord give before increasing the rent, and what is the cap?", a: "At least 2 months' written notice; the increase cannot exceed the 12-month change in the Lindenford Consumer Price Index plus 1%."}
      - title: "5. Utilities and council charges"
        text: "The Tenants are responsible for electricity, gas, water, telephone, broadband and the local council charge for the property during the tenancy. The Tenants must tell the suppliers when the tenancy starts and ends."
        questions:
          - {type: clause, q: "Under the lease, who pays for water and the council charge?", a: "The Tenants are responsible for water and the local council charge (as well as electricity, gas, phone and broadband)."}
      - title: "6. Use of the property"
        text: "The Tenants will use the property as a private home only. The Tenants may work from home, provided no clients or customers visit the property and no goods are stored for business purposes."
        questions:
          - {type: clause, q: "Are we allowed to run the illustration business from the flat?", a: "Working from home is allowed, as long as no clients or customers visit and no goods are stored for business purposes."}
      - title: "7. Pets"
        text: "The Tenants must not keep any pet at the property without the Landlord's prior written consent, which will not be unreasonably withheld. If consent is given, the Tenants must have the carpets professionally cleaned at the end of the tenancy."
        questions:
          - {type: clause, q: "Can we keep a cat in the flat?", a: "Only with the Landlord's prior written consent, which will not be unreasonably withheld; carpets must then be professionally cleaned at the end.", near_miss: true}
      - title: "8. Repairs"
        text: "The Landlord is responsible for repairs to the structure and exterior of the property and to installations for water, gas, electricity, heating and sanitation. The Tenants must report any disrepair promptly and are responsible for minor maintenance such as replacing light bulbs and smoke alarm batteries."
        questions:
          - {type: clause, q: "Who is responsible for repairing the boiler and heating at the flat?", a: "The Landlord (repairs to installations for heating, gas, water, electricity and sanitation)."}
      - title: "9. Access"
        text: "The Landlord or agent may enter the property at reasonable times to inspect or carry out repairs, after giving at least 24 hours' written notice, except in an emergency."
        questions:
          - {type: clause, q: "How much notice must the landlord give before entering the flat for an inspection?", a: "At least 24 hours' written notice, except in an emergency."}
      - title: "10. Ending the tenancy"
        text: "The Tenants may end the tenancy at the end of the fixed term, or at any time during a periodic tenancy, by giving at least 2 months' written notice. The Landlord must give at least 3 months' written notice and may only end the tenancy on grounds allowed by law."
        questions:
          - {type: clause, q: "How much notice do we have to give to leave the flat?", a: "At least 2 months' written notice (at the end of the fixed term or during a periodic tenancy)."}
          - {type: date_deadline, q: "If we want to leave the flat when the fixed term ends, by when must we give notice?", a: "By 31 May 2026: at least 2 months' written notice before the fixed term ends on 31 July 2026."}
      - title: "11. Inventory and condition"
        text: "An inventory and schedule of condition was agreed on 1 August 2025. At the end of the tenancy the property will be checked against it. The Tenants are not responsible for fair wear and tear."
      - title: "12. Smoking"
        text: "The Tenants must not smoke, or allow visitors to smoke, inside the property, including e-cigarettes."
      - title: "13. Insurance"
        text: "The Landlord insures the building. The Tenants are responsible for insuring their own contents and personal belongings."
        questions:
          - {type: clause, q: "Who insures the building we rent, and who insures our belongings?", a: "The Landlord insures the building; the Tenants insure their own contents and belongings."}
      - title: "14. Notices"
        text: "Notices under this agreement must be in writing and may be sent by email to the addresses given by each party at the start of the tenancy."
      - title: "15. Data protection"
        text: "The agent will process the Tenants' personal data only to manage the tenancy, in line with its privacy notice."

  - doc_id: contract-home-insurance
    vendor: Shieldwell Insurance
    title: "Shieldwell Home Contents Insurance: Policy Schedule and Wording"
    reference: "SHW-HC-204418"
    doc_date: "2025-08-22"
    intro: "This document contains your policy schedule and the policy wording. Please read them together. Words in bold in the wording have the meanings given in the Definitions section."
    summary:
      - ["Policyholders", "Robin Marlowe and Sam Okafor"]
      - ["Policy number", "SHW-HC-204418"]
      - ["Insured address", "Flat 3, 14 Quill Lane, Lindenford LF2 7QA"]
      - ["Period of insurance", "1 September 2025 to 31 August 2026"]
      - ["Contents sum insured", "€45,000"]
      - ["Annual premium", "€214.80 (paid monthly, €17.90 x 12)"]
      - ["Optional cover", "Accidental damage: included. Personal possessions away from home: included"]
    clauses:
      - title: "1. Definitions"
        text: "Contents means household goods and personal belongings owned by you or for which you are legally responsible. Valuables means jewellery, watches, art and collections. Business equipment means computers and other equipment used for your trade or profession."
      - title: "2. What is covered"
        text: "We will pay for loss of or damage to your contents caused by fire, smoke, storm, flood, escape of water or oil, theft or attempted theft, vandalism, subsidence and impact, up to the contents sum insured."
      - title: "3. Excesses"
        text: "You must pay the first part of every claim. The standard excess is €250 for each claim. For claims caused by escape of water the excess is €400. For claims under the accidental damage section the excess is €100."
        questions:
          - {type: clause, q: "What is the standard excess on our home contents insurance?", a: "€250 for each claim."}
          - {type: clause, q: "What excess applies to a claim for escape of water under the contents policy?", a: "€400.", near_miss: true}
      - title: "4. Limits"
        text: "The most we will pay for any single item is €1,500 unless it is listed on the schedule. The most we will pay for all valuables in total is €6,000. Bicycles are covered up to €800 each, but only if locked to an immovable object or kept in a locked building."
        questions:
          - {type: clause, q: "What is the single item limit on the contents policy?", a: "€1,500 for any single item unless it is listed on the schedule."}
          - {type: clause, q: "Is a bicycle covered by the contents insurance, and up to how much?", a: "Yes, up to €800 per bicycle, if locked to an immovable object or kept in a locked building."}
      - title: "5. Personal possessions away from home"
        text: "We will cover your personal possessions while temporarily away from the home anywhere in the world for up to 60 days in any period of insurance, up to €2,500 in total. Mobile phones are covered up to €600 each."
        questions:
          - {type: clause, q: "Are our belongings covered when we travel, and up to what amount?", a: "Yes, personal possessions away from home are covered worldwide for up to 60 days per period, up to €2,500 in total (phones up to €600 each)."}
      - title: "6. Business equipment"
        text: "Business equipment kept at the home is covered up to €3,000 in total. Business equipment is not covered while away from the home unless shown on the schedule. Business stock and money belonging to a business are not covered."
        questions:
          - {type: clause, q: "Is Sam's work laptop covered by the home insurance?", a: "Business equipment kept at home is covered up to €3,000 in total; it is not covered away from home unless shown on the schedule."}
      - title: "7. Accidental damage"
        text: "We will pay for accidental damage to your contents inside the home, such as spilling paint on a carpet or dropping a television. We will not pay for damage caused by pets, by wear and tear, or by cleaning or repairing an item."
        questions:
          - {type: clause, q: "Does our home insurance pay for damage caused by pets?", a: "No; accidental damage cover excludes damage caused by pets.", near_miss: true}
      - title: "8. What is not covered"
        text: "We will not pay for loss or damage caused by gradual deterioration, moth or vermin, mechanical or electrical breakdown, theft when the home is lent or let, or any loss when the home has been unoccupied for more than 45 consecutive days."
        questions:
          - {type: clause, q: "After how many days unoccupied does the home contents cover stop applying?", a: "More than 45 consecutive days."}
      - title: "9. Making a claim"
        text: "You must report any claim to us as soon as possible, and theft or vandalism to the police within 24 hours. You must provide proof of ownership and value where we ask for it."
      - title: "10. Cancellation"
        text: "You may cancel within 14 days of receiving these documents and receive a full refund if you have not made a claim. After that, you may cancel at any time and we will refund the premium for the unused period, less an administration fee of €25."
        questions:
          - {type: clause, q: "If we cancel the contents insurance after the cooling-off period, what fee applies?", a: "An administration fee of €25 (the unused premium is refunded)."}
      - title: "11. Renewal"
        text: "We will send your renewal invitation at least 21 days before the end of the period of insurance. If you pay monthly, your policy will renew automatically unless you tell us not to."
        questions:
          - {type: clause, q: "Does the home contents policy renew automatically?", a: "Yes, if paid monthly it renews automatically unless you tell Shieldwell not to; the renewal invitation comes at least 21 days before the period ends."}
      - title: "12. Complaints"
        text: "If you have a complaint, contact Shieldwell Customer Relations. If we cannot resolve it within 8 weeks, you can refer it to the Financial Services Ombudsman."

